<!DOCTYPE html>
<html>
<head>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://microsoft.com"></script>
    <style>
        .dynamic-btn {
            background-color: #0078d4;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- This is your actual clickable button inside the presentation -->
    <button class="dynamic-btn" onclick="navigateDynamicURL()">See Referral Program</button>

    <script>
        Office.onReady(function (info) {
            // Add-in is ready to use in PowerPoint Online
        });

        function navigateDynamicURL() {
           // Use the asynchronous method to fetch the true parent presentation URL
            Office.context.document.getFilePropertiesAsync(function (asyncResult) {
                var ref_codeVal = "";
                
                if (asyncResult.status === Office.AsyncResultStatus.Succeeded) {
                    var fullUrl = asyncResult.value.url;

                    if (fullUrl) {
                        // Decode symbols like %3F or %3D into clean characters
                        fullUrl = decodeURIComponent(fullUrl);

                        // Extract the ref_code parameter properly
                        if (fullUrl.indexOf("ref_code=") !== -1) {
                            // Split the URL string and grab the second chunk [1]
                            var urlRemainder = fullUrl.split("ref_code=")[1];
                            // Split again at the ampersand and grab the first chunk [0]
                            ref_codeVal = urlRemainder.split("&")[0];
                        }
                    }
                }

                // The target Microsoft Forms base URL string
                var targetBase = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=_MSOSAhWCU-58g5NWN60rLDY5boRiUtGh9DEk46C1F5UQlpOREZNSkVSM0xIVENETlg4MlU5MVlZRC4u&r06ff935c6ca44bfb9f3af3886c4111fd=";

            // Open the new URL with the appended uid parameter
            if (ref_codeVal !== "") {
                 window.open(targetBase + ref_codeVal);
            } else {
                window.open(targetBase); // fallback if uid is missing
            }
        }
    </script>
</body>
</html>
